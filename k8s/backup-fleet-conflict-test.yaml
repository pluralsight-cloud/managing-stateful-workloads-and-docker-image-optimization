apiVersion: v1
kind: Pod
metadata:
  name: backup-fleet-conflict-test
spec:
  nodeName: <NODE>
  containers:
    - name: test
      image: 10.0.1.104:5000/backup-tool:latest
      args: ["sleep", "infinity"]
      volumeMounts:
        - name: backups
          mountPath: /backups
  volumes:
    - name: backups
      persistentVolumeClaim:
        claimName: backups-backup-fleet-0
